name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: pub-hk-ubuntu-24.04-ip
    strategy:
      matrix:
        java-version: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: ./mvnw --batch-mode verify
